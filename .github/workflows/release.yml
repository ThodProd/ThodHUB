name: Build Windows hub
on:
  push:
    tags: ['v*', 'hub-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./scripts/build-hub.ps1 -Tag $env:GITHUB_REF_NAME }
          else { ./scripts/build-hub.ps1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ThodHUB-win-x64
          path: artifacts/release/*
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Published release already exists; keeping immutable assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME artifacts/release/* --verify-tag --generate-notes
