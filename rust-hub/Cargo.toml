[package]
name = "thodhub"
version = "0.2.6"
edition = "2024"
description = "ThodHUB — Rust port of the Windows hub shell"
build = "build.rs"
default-run = "ThodHUB"

[[bin]]
name = "ThodHUB"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
muda = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rfd = "0.18"
arboard = "3"
winreg = "0.56"
url = "2"
quick-xml = "0.42"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["ico"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
